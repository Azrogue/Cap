name: Build Windows ARM64

on:
  push:
    branches: [ main, develop ]
    tags: ['v*']
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggers

jobs:
  build-windows-arm64:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust with ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install pnpm
        run: npm install -g pnpm@8.10.5

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            target/
          key: ${{ runner.os }}-arm64-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-arm64-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Setup Cap environment
        run: pnpm cap-setup

      - name: Create .env file
        run: |
          echo "VITE_ENVIRONMENT=production" >> .env
          echo "CAP_DESKTOP_SENTRY_URL=https://6a3b6a09e6ae976c2ad6fff710e88748@o4506859771527168.ingest.us.sentry.io/4508330917101568" >> .env
          echo "NEXT_PUBLIC_WEB_URL=https://cap.so" >> .env
          echo 'NEXTAUTH_URL=https://cap.so' >> .env
          echo "NEXT_PUBLIC_CAP_AWS_REGION=us-east-1" >> .env
          echo "NEXT_PUBLIC_CAP_AWS_BUCKET=cap-prod" >> .env

      - name: Build desktop app (Windows ARM64 - Debug)
        run: |
          cd apps/desktop
          pnpm tauri build --target aarch64-pc-windows-msvc --debug --no-bundle

      - name: Build desktop app (Windows ARM64 - Release)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cd apps/desktop
          pnpm tauri build --target aarch64-pc-windows-msvc --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cap-desktop-windows-arm64
          path: apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/**/
          retention-days: 30

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cap-desktop-windows-arm64-debug
          path: apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/debug/bundle/**/
          retention-days: 7
