[build]
# Optimize for CI/CD environments
rustflags = ["-C", "target-cpu=native"]

[target.aarch64-pc-windows-msvc]
# Specific optimizations for Windows ARM64
rustflags = ["-C", "target-cpu=neoverse-n1", "-C", "link-arg=/CARGO_TERM_COLOR=always"]

[target.x86_64-pc-windows-msvc]
# Optimizations for Windows x64
rustflags = ["-C", "target-cpu=haswell"]

[target.x86_64-apple-darwin]
# Optimizations for macOS Intel
rustflags = ["-C", "target-cpu=native"]

[target.aarch64-apple-darwin]
# Optimizations for macOS ARM64
rustflags = ["-C", "target-cpu=apple-m1"]

[target.x86_64-unknown-linux-gnu]
# Optimizations for Linux x64
rustflags = ["-C", "target-cpu=native"]
